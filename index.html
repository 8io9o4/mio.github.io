/div><div>☾ 방해금지 모드</div><div class="round">📷</div></div>${bar('unlock')}<div class="locktap" onclick="go('pass')"></div></div>`}else if(page==='pass'){h=`<div class="page dark">${status(true)}<div class="pass-title">암호 입력</div><div class="dots">${[0,1,2,3].map(i=>`<div class="dot ${i<digits.length?'filled':''}"></div>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':`<button class="num" onclick="digit('${n}')">${n}<small>${({2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'})[n]||'　'}</small></button>`).join('')}</div><div class="passfoot"><span>긴급 상황</span><button onclick="digits='';go('lock')">취소</button></div>${bar('lock')}</div>`}else if(page==='home'){let d=new Date();let days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let start=new Date(d.getFullYear(),d.getMonth(),1).getDay();h=`<div class="page dark">${status(true)}<div class="homewidgets"><div><div class="widget"><b style="color:#f34">${d.getMonth()+1}월</b><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<b>${x}</b>`).join('')}${Array.from({length:start},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>`<span class="${i+1===d.getDate()?'calactive':''}">${i+1}</span>`).join('')}</div></div><div class="widgetlabel">캘린더</div></div><div><div class="widget weather"><b>Seoul</b><div style="font-size:49px;font-weight:200">14°</div><div style="margin-top:25px;font-size:14px">☁ 부분적으로 흐림<br>최고:15° 최저:7°</div></div><div class="widgetlabel">날씨</div></div></div><div class="appgrid">${icon('카메라','📷','linear-gradient(#aaa,#ddd)')}${icon('사진','🌈','#fff','photos')}${icon('음악','♫','linear-gradient(#ff6882,#fa003e)','music')}${icon('설정','⚙️','linear-gradient(#bbb,#888)','settings')}${icon('시계','🕒','#fff','alarm')}${icon('Instagram','◎','linear-gradient(30deg,#ffbd00,#fa0067,#8028e7)','instagram')}${icon('Safari','🧭','#fff')}${icon('App Store','Ⓐ','#1299f7')}</div><div class="dock">${icon('','☎','#33d65b')}${icon('','●','#36d55d pan class="muted">›</span></div>`).join('')}</div><div class="player"><span>🎵</span><span style="flex:1">Somebody<br><small>Justin Bieber</small></span><button onclick="playing=!playing;render()">${playing?'Ⅱ':'▶'}</button></div>${bar()}</div>`}else if(page==='songs'){let ss=playlist==='psh'?songs1:songs2;h=`<div class="page" style="background:#e5e5dd">${status()}<div class="appbody">${top('','music')}<img class="playlistcover" src="${A+(playlist==='psh'?'ref9.jpg':'ref13.jpg')}"><div style="text-align:center;font-size:27px;font-weight:750">${playlist}</div><div style="text-align:center">S</div><div class="muted" style="text-align:center;font-size:12px">방금 업데이트됨</div><div style="display:flex;justify-content:space-evenly;margin:18px"><button>⤨</button><button style="background:#000;color:white;border-radius:30px;padding:10px 65px" onclick="playing=!playing;render()">${playing?'Ⅱ 일시정지':'▶ 재생'}</button><button>✓</button></div>${ss.map(([song,artist],i)=>`<div class="song"><img src="${A+(playlist==='psh'?'ref9.jpg':'ref13.jpg')}"><div class="songinfo"><div>${esc(song)}</div><small>${esc(artist)}</small></div><span>•••</span></div>`).join('')}</div><div class="player"><span>🎵</span><span style="flex:1">${esc(ss[0][0])}</span><button onclick="playing=!playing;render()">${playing?'Ⅱ':'▶'}</button></div>${bar()}</div>`}else if(page==='settings'){h=`<div class="page" style="background:#f2f2f7">${status()}<div class="appbody"><h1 class="heading" style="margin-top:70px">설정</h1><div class="settingsgroup"><div class="settingrow"><div class="avatar">T</div><div style="flex:1"><b>Taesan Han</b><div class="muted" style="font-size:12px">Apple 계정, iCloud+ 등</div></div>›</div><div class="settingrow">Apple 계정 제안 <span style="margin-left:auto;color:red">3</span></div></div><div class="settingsgroup"><div class="settingrow">Add AppleCare Coverage</div></div><div class="settingsgroup"><div class="settingrow">🎧 AirPods Pro</div></div><div class="settingsgroup">${[['✈️','에어플레인 모드',''],['📶','Wi-Fi','TS작업실'],['ᛒ','Bluetooth','켬'],['📡','셀룰러',''],['🔗','개인용 핫스팟','']].map(x=>`<div class="settingrow"><span>${x[0]}</span><span style="flex:1">${x[1]}</span><span class="muted">${x[2]} ›</span></div>`).join('')}</div></div>${bar()}</div>`}else if(page==='alarm'){h=`<div class="page dark">${status(true)}<div class="appbody"><div class="head"><button>편집</button><button>＋</button></div><h1 class="heading">알람</h1><div class="sectiontitle">🛏 수면 | 기상</div><div class="muted" style="padding:15px">알람 없음</div><div class="sectiontitle">기타</div>${[['07:00','기상 · 월, 화, 수, 목, 금, 토'],['10:30','알람']].map(x=>`<div class="clockrow"><div style="flex:1"><div class="clocktime">${x[0]}</div><small class="muted">${x[1]}</small></div><div class="toggle"></div></div>`).join('')}</div><div class="igbottom" style="background:#141414;color:#777"><button>◎<small style="display:block;font-size:10px">세계 시계</small></button><button style="color:#ff9500">◴<small style="display:block;font-size:10px">알람</small></button><button>◷<small style="display:block;font-size:10px">스톱워치</small></button><button>◴<small style="display:block;font-size:10px">타이머</small></button></div>${bar()}</div>`}else if(page==='instagram'){h=`<div class="page">${status()}<div class="appbody"><div class="head" style="font-size:28px"><button>＋</button><b style="font-family:cursive">Instagram</b><button>♡</button></div><div class="instastories">${['내 스토리','bonniegyeong_','psychclub_uw','jeemin._.k'].map((x,i)=>`<div class="story"><div class="storyring"><div>${i===2?'🧠':'●'}</div></div>${x}</div>`).join('')}</div><div style="padding:15px;font-size:13px;color:#777">✓ 팔로우하는 계정의 최신 게시물을 모두 확인했습니다.</div><b style="padding:15px">회원님을 위한 추천</b><div style="padding:18px">meong_cheong</div><img style="width:100%;height:330px;object-fit:cover" src="${A}ref15.jpg"></div>${igBar()}${bar()}</div>`}else if(page==='igprofile'){h=`<div class="page">${status()}<div class="appbody"><div class="head"><button>＋</button><b>taesan810⌄</b><button>☰</button></div><div class="igprofile"><div class="avatar" style="background:#eee;color:#666">＋</div><div><strong>0</strong><br><span>게시물</span></div><div><strong>3,571</strong><br><span>팔로워</span></div><div><strong>142</strong><br><span>팔로잉</span></div></div><div style="padding:0 20px">Taesan Han</div><div class="igbuttons"><button>프로필 편집</button><button>프로필 공유</button></div><div class="instastories"><div class="story"><div class="storyring" style="border-color:#ddd"><div>＋</div></div>New</div><div class="story"><div class="storyring" style="border-color:#ddd"><div>☆</div></div>highlights</div></div><div style="display:flex;justify-content:space-around;padding:20px;border-bottom:1px solid #eee">▦　　▣　　♧</div><div class="iggrid">${Array.from({length:6},()=>'<div></div>').join('')}</div></div>${igBar()}${bar()}</div>`}else if(page==='igdm'){h=`<div class="page">${status()}${top('메시지','instagram')}<h1 class="heading">메시지</h1><div class="note">대화는 나중에 추가할 수 있어요.</div>${igBar()}${bar()}</div>`}document.getElementById('screen').innerHTML=h;tick()}
function igBar(){return `<div class="igbottom"><button onclick="go('instagram')">⌂</button><button>▣</button><button onclick="go('igdm')">➤</button><button>⌕</button><button onclick="go('igprofile')">◉</button></div>`}function digit(n){digits+=n;if(digits.length===4){if(digits==='0904'){digits='';setTimeout(()=>go('home'),200)}else{setTimeout(()=>{digits='';render()},450)}}render()}function tick(){const d=new Date(),fmt=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'});let t=document.getElementById('statusclock');if(t)t.textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});let ld=document.getElementById('lockdate');if(ld)ld.textContent=fmt.format(d);let lt=document.getElementById('locktime');if(lt)lt.textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false})}setInterval(tick,1000);document.addEventListener('keydown',e=>{if(page==='pass'&&/^\d$/.test(e.key))digit(e.key);if(e.key==='Escape')go('home')});let touchY=0;document.addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});document.addEventListener('touchend',e=>{if(page==='lock'&&touchY-e.changedTouches[0].clientY>60)go('pass')},{passive:true});render();
